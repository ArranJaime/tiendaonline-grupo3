AWSTemplateFormatVersion: '2010-09-09'
Description: >
  URPOnline - Conexión segura GitHub Actions -> AWS sin Access Keys (OIDC).
  Crea el proveedor de identidad de GitHub y un rol IAM que SOLO puede asumir
  tu repositorio. Se despliega UNA vez por cuenta de AWS.
Parameters:
  GitHubOwner:
    Type: String
    Default: 'ArranJaime'
    Description: Tu usuario u organización de GitHub (el dueño de TU fork)
  RepoName:
    Type: String
    Default: tiendaonline-grupo3
    Description: Nombre de tu repositorio en GitHub
  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "false si tu cuenta ya tiene el proveedor token.actions.githubusercontent.com"
Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, 'true']
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'urponline-github-deploy-${RepoName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub':
                  - !Sub 'repo:${GitHubOwner}/${RepoName}:*'
                  - 'repo:ArranJaime/tiendaonline-grupo3:*'
                  - 'repo:Jesussv2/tiendaonline-grupo3:*'
      # Laboratorio: la pila crea VPC, EC2, RDS, ElastiCache, IAM, S3... por eso AdministratorAccess.
      # Mejora para producción: reemplazar por una política de mínimo privilegio.
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess']
      MaxSessionDuration: 7200
Outputs:
  RoleArn:
    Description: Copia este valor al secreto AWS_ROLE_ARN de tu repositorio en GitHub
    Value: !GetAtt DeployRole.Arn
